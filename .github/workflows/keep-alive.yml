name: Keep Supabase Awake

on:
  schedule:
    # Runs once a day at 03:00 UTC (12:00 JST). Public repos have
    # unlimited free GitHub Actions minutes, so daily is safe and cheap.
    - cron: '0 3 * * *'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (programs table)
        run: |
          curl -sS -o /dev/null -w "HTTP status: %{http_code}\n" \
            "https://ueibndaqzqnkqlwwsoct.supabase.co/rest/v1/programs?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlaWJuZGFxenFua3Fsd3dzb2N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTg5MTIsImV4cCI6MjEwMDkzNDkxMn0.9m20jeKf6GrRfFqQrGdoocF_iV3rH4r6tB9PZPrt1HE" \
